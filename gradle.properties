# Do NOT set org.gradle.java.home here. It hard-codes one machine's JDK path and
# breaks every other machine - this repo also runs on a Kali VM.
#
# The JDK is chosen by the Java toolchain in build.gradle (languageVersion = 17),
# which the training VM's stock JDK 17 satisfies with nothing to download.
# Gradle itself needs a JVM of 17+ to run; in IntelliJ that is the "Gradle JVM"
# setting, not this file.
