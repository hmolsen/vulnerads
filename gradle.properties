# Do NOT set org.gradle.java.home here. It hard-codes one machine's JDK path and
# breaks every other machine - this repo also runs on a Kali VM.
#
# The JDK is chosen by the Java toolchain in build.gradle (languageVersion = 25).
# settings.gradle applies the foojay-resolver-convention plugin, so Gradle either
# detects an installed JDK 25 or downloads one automatically, on any platform.
